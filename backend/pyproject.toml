[tool.poetry]
name = "project-ming-backend"
version = "0.1.0"
description = "Project MING v6.0 - The Awakening Protocol Backend"
authors = ["Project MING Team"]

[tool.poetry.dependencies]
python = "^3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
