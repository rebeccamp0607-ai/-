<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#080810;--bg2:#0f0f1a;--gold:#c9a84c;--gold2:#e8c96a;--red:#d44f2a;--blue:#2a6bd4;--green:#2ad44f;--purple:#8b5cf6;--text:#e8dfc8;--text2:#a09880;--text3:#5a5240}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;height:100%;overflow:hidden;user-select:none}
#app{height:100vh;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:opacity .3s,transform .3s;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.hidden{opacity:0;pointer-events:none;transform:translateX(20px)}
.btn{display:block;width:100%;padding:16px 20px;border-radius:16px;border:none;font-size:16px;font-weight:700;cursor:pointer;transition:transform .15s,opacity .15s;color:var(--text);text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.btn:active{transform:scale(.96);opacity:.8}
.btn-gold{background:linear-gradient(135deg,rgba(201,168,76,.3),rgba(201,168,76,.15));border-color:rgba(201,168,76,.4)}
.btn-purple{background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(139,92,246,.15));border-color:rgba(139,92,246,.4)}
.btn-teal{background:linear-gradient(135deg,rgba(42,212,79,.2),rgba(42,212,79,.08));border-color:rgba(42,212,79,.3)}
.btn-red{background:rgba(212,79,42,.2);border-color:rgba(212,79,42,.4)}
input,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:14px 16px;color:var(--text);font-size:15px;font-family:inherit;outline:none;resize:none}
input:focus,textarea:focus{border-color:rgba(201,168,76,.5)}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;background:rgba(255,255,255,.08);color:var(--text2)}
.san-bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.san-fill{height:100%;border-radius:3px;transition:width .6s}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:20px}
.loader{display:inline-block;width:20px;height:20px;border:2px solid rgba(201,168,76,.3);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{display:none}
</style>
</head>

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// ═══════════════════════════════════════
// AI 调用
// ═══════════════════════════════════════
async function callAI(userPrompt, sys='你是命运裁判，精通东方命理与沉浸式叙事。回答简洁有力。', maxTokens=400){
  try{
    const r = await fetch('https://api.siliconflow.cn/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+G.aiKey},
      body:JSON.stringify({
        model:'Qwen/Qwen2.5-72B-Instruct',
        messages:[{role:'system',content:sys},{role:'user',content:userPrompt}],
        max_tokens:maxTokens, temperature:0.88
      })
    });
    const d = await r.json();
    return d.choices?.[0]?.message?.content || '';
  }catch(e){ return ''; }
}

// ═══════════════════════════════════════
// 开始游戏（内置世界）
// ═══════════════════════════════════════
function startGame(short, name, power, currency, role, conflict, opening){
  G.worldShort=short; G.worldName=name; G.power=power;
  G.currency=currency; G.role=role; G.conflict=conflict;
  G.opening=opening; G.day=1; G.san=100; G.cog=0;
  G.obsessions=[]; G.eventIdx=0;
  G.events = [...(EVENTS[short]||EVENTS['都市'])];
  show('s-game');
  updateBar();
  renderEvent();
}

// ═══════════════════════════════════════
// 创世神模式
// ═══════════════════════════════════════
async function doGenesis(){
  const prompt = document.getElementById('genesis-input').value.trim();
  if(!prompt) return;
  document.getElementById('genesis-btn').style.display='none';
  document.getElementById('genesis-loading').style.display='block';
  const sys = '你是 Project MING 的创世引擎。根据玩家的世界描述，输出 JSON（不要有任何多余内容）。';
  const userP = `玩家想要的世界：${prompt}\n\n请输出以下 JSON：\n{"worldName":"世界名称(4字内)","power":"统治力量(8字内)","currency":"货币单位(4字内)","role":"玩家身份(8字内)","conflict":"核心矛盾(15字内)","opening":"开场白(80字内，第二人称，末尾省略号)","events":[{"title":"事件名(8字内)","body":"事件描述(60字内)","opt1":"选项A(6字内)","opt2":"选项B(6字内)"},{"title":"...","body":"...","opt1":"...","opt2":"..."},{"title":"...","body":"...","opt1":"...","opt2":"..."}]}`;
  const raw = await callAI(userP, sys, 800);
  document.getElementById('genesis-loading').style.display='none';
  document.getElementById('genesis-btn').style.display='block';
  try{
    const j = JSON.parse(raw.replace(/```json|```/g,'').trim());
    const evts = (j.events||[]).map((e,i)=>({
      id:'g'+i, title:e.title||'神秘事件', body:e.body||'命运面临抉择',
      opts:[{t:e.opt1||'接受',s:Math.floor(Math.random()*20-5),c:Math.floor(Math.random()*15+3),obs:''},
            {t:e.opt2||'拒绝',s:Math.floor(Math.random()*20-10),c:Math.floor(Math.random()*10),obs:''}]
    }));
    // 用标准事件库补足至6个
    const fallback = [...EVENTS['都市']];
    while(evts.length<6) evts.push(fallback[evts.length%fallback.length]);
    G.worldShort='创世'; G.worldName=j.worldName||'新世界';
    G.power=j.power||''; G.currency=j.currency||'';
    G.role=j.role||'旅行者'; G.conflict=j.conflict||'';
    G.opening=j.opening||'命运的齿轮开始转动……';
    G.day=1; G.san=100; G.cog=0; G.obsessions=[]; G.eventIdx=0;
    G.events=evts;
    show('s-game'); updateBar(); renderEvent();
  }catch{
    document.getElementById('genesis-input').value='';
    document.getElementById('genesis-input').placeholder='解析失败，请换个描述再试';
  }
}

// ═══════════════════════════════════════
// 状态条更新
// ═══════════════════════════════════════
function updateBar(){
  document.getElementById('world-name-bar').textContent = G.worldName;
  document.getElementById('day-bar').textContent = 'Day '+G.day;
  document.getElementById('san-num').textContent = G.san;
  document.getElementById('cog-bar').textContent = G.cog;
  const fill = document.getElementById('san-fill');
  fill.style.width = G.san+'%';
  fill.style.background = G.san>60?'#c9a84c':G.san>30?'#f59e0b':'#ef4444';
  document.getElementById('san-num').style.color = G.san>60?'var(--gold)':G.san>30?'#f59e0b':'#ef4444';
}

// ═══════════════════════════════════════
// 渲染事件
// ═══════════════════════════════════════
function renderEvent(){
  const ev = G.events[G.eventIdx % G.events.length];
  const gc = document.getElementById('game-content');
  gc.innerHTML = `<div class="fade-in">
    <div class="card" style="margin-bottom:16px">
      <div style="font-size:18px;font-weight:700;margin-bottom:10px">${ev.title}</div>
      <div style="font-size:14px;color:var(--text2);line-height:1.8">${ev.body}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${ev.opts.map((o,i)=>`<button class="btn" onclick="chooseOpt(${i})" id="opt${i}"><span style="color:var(--gold);margin-right:6px">${['A','B'][i]}</span>${o.t}</button>`).join('')}
      <button class="btn btn-purple" onclick="showFreeWill()" style="text-align:center;font-size:14px;padding:14px">✦ 自由意志（自己输入）</button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════
// 选择选项
// ═══════════════════════════════════════
function chooseOpt(i){
  const ev = G.events[G.eventIdx % G.events.length];
  const opt = ev.opts[i];
  applyChoice(opt.t, opt.s, opt.c, opt.obs, null);
}

async function applyChoice(label, sanD, cogD, obs, aiNarrative){
  G.san = Math.max(0, Math.min(100, G.san+sanD));
  G.cog = Math.max(0, G.cog+cogD);
  if(obs) G.obsessions = [...G.obsessions.slice(-3), obs];
  updateBar();
  const gc = document.getElementById('game-content');
  const ev = G.events[G.eventIdx % G.events.length];
  const sanTxt = sanD>=0?`<span style="color:#4ade80">San +${sanD}</span>`:`<span style="color:#f87171">San ${sanD}</span>`;
  const cogTxt = cogD>=0?`<span style="color:var(--gold)">认知 +${cogD}</span>`:`<span style="color:#f87171">认知 ${cogD}</span>`;
  let narrative = aiNarrative;
  if(!narrative){
    // 根据选择生成简短后果
    const fallbacks = {
      '赴约谈':'你赴约了，对方开价诱人，却要求立刻辞职……',
      '婉言谢绝':'你拒绝了。也许这是对的选择，也许……',
      '当场澄清':'你开口了，有条有理。气氛很僵，但事实摆在那里。',
      '沉默忍耐':'你选择了沉默。愤怒在胸腔里滚烫。今晚注定难眠。',
      '借，朋友义气':'你转了钱。他说会尽快还，你点了点头。',
      '拒绝，保护自己':'你拒绝了。对方沉默，你也沉默。关系开始微妙。',
    };
    narrative = fallbacks[label] || `你选择了「${label}」。命运的齿轮再转一格。`;
  }
  gc.innerHTML = `<div class="fade-in">
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:13px;color:var(--text3);margin-bottom:6px">你的选择：${label}</div>
      <div style="font-size:14px;color:var(--text);line-height:1.8">${narrative}</div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:20px;font-size:13px">${sanTxt} ${cogTxt}</div>
    ${G.san<=0?`<button class="btn btn-red" onclick="endGame()" style="text-align:center;font-size:16px">命运终结…</button>`
    :`<button class="btn btn-gold" onclick="nextDay()" style="text-align:center;font-size:16px">${G.san<40?'夜幕降临 🌙':'Day '+(G.day+1)+' →'}</button>`}
  </div>`;
}

// ═══════════════════════════════════════
// 自由意志
// ═══════════════════════════════════════
function showFreeWill(){
  const ev = G.events[G.eventIdx % G.events.length];
  const gc = document.getElementById('game-content');
  gc.innerHTML = `<div class="fade-in">
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:14px;font-weight:700;margin-bottom:8px">${ev.title}</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.7">${ev.body}</div>
    </div>
    <textarea id="free-input" rows="3" placeholder="描述你的方案，AI实时裁判结果…" style="margin-bottom:12px"></textarea>
    <div id="free-loading" style="display:none;text-align:center;padding:16px"><div class="loader"></div><div style="font-size:13px;color:var(--text2);margin-top:10px">AI 裁判中…</div></div>
    <button class="btn btn-purple" id="free-btn" onclick="submitFreeWill()" style="text-align:center;font-size:16px;margin-bottom:10px">提交给命运裁判</button>
    <button class="btn" onclick="renderEvent()" style="text-align:center;font-size:14px;color:var(--text2)">返回选项</button>
  </div>`;
}

async function submitFreeWill(){
  const input = document.getElementById('free-input').value.trim();
  if(!input) return;
  document.getElementById('free-btn').style.display='none';
  document.getElementById('free-loading').style.display='block';
  const ev = G.events[G.eventIdx % G.events.length];
  const p = `世界：${G.worldName}（${G.worldShort}风格）\n当前场景：${ev.title}—${ev.body}\n玩家的方案："${input}"\n\n请以命运裁判身份输出 JSON（不要有其他内容）：\n{"feasibility":0到100的整数,"success":0到100的整数,"narrative":"80字内的结果叙事（直接描述后果，不要解释）","san_delta":-20到15的整数,"cog_delta":0到25的整数,"obs":"若结果不好则写一个10字内的执念，否则写空字符串"}`;
  const raw = await callAI(p, '你是严肃的命运裁判AI，直接输出JSON。', 300);
  document.getElementById('free-loading').style.display='none';
  try{
    const j = JSON.parse(raw.replace(/```json|```/g,'').trim());
    const label = `[自由意志] ${input}`;
    const narrative = `可行性 ${j.feasibility}% · 成功率 ${j.success}%\n\n${j.narrative}`;
    await applyChoice(label, j.san_delta||0, j.cog_delta||0, j.obs||'', narrative);
  }catch{
    await applyChoice(`[自由意志] ${input}`, -5, 5, '', '命运难以预测，但你走出了自己的路。');
  }
}

// ═══════════════════════════════════════
// 下一天
// ═══════════════════════════════════════
function nextDay(){
  G.day++; G.eventIdx++;
  updateBar();
  if(G.san < 40){ enterDream(); return; }
  renderEvent();
}

// ═══════════════════════════════════════
// 梦境
// ═══════════════════════════════════════
async function enterDream(){
  show('s-dream');
  document.getElementById('dream-content').innerHTML = '<div style="text-align:center"><div class="loader"></div><div style="font-size:13px;color:rgba(139,92,246,.6);margin-top:12px">正在潜入潜意识…</div></div>';
  document.getElementById('dream-choices').innerHTML = '';
  const obs = G.obsessions.length ? G.obsessions.join('、') : '未解的压力';
  const p = `玩家今日执念：${obs}\n世界：${G.worldName}\nSan值：${G.san}/100\n\n请生成一段梦境叙事（120字内，第二人称，超现实意象，结尾用"【直面】xxx / 【逃避】xxx"给出两个选择，每个选择5字内）`;
  const raw = await callAI(p, '你是梦境叙事大师，语言诗意震撼。', 350);
  let narrative = raw || '黑暗中，只有一丝微弱的光……\n\n【直面】走向光明 / 【逃避】留在黑暗';
  // 解析选择
  const m = narrative.match(/【直面】(.+?)\s*\/\s*【逃避】(.+?)$/s);
  const directTxt = m ? m[1].trim() : '走向光明';
  const escapeTxt = m ? m[2].trim() : '留在黑暗';
  const bodyTxt = m ? narrative.slice(0, narrative.indexOf('【直面】')).trim() : narrative;
  document.getElementById('dream-type-label').textContent = obs ? `执念：${obs}` : '梦境';
  document.getElementById('dream-content').innerHTML = bodyTxt.replace(/\n/g,'<br>');
  document.getElementById('dream-choices').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px">
      <button class="btn btn-teal" onclick="resolveDream('direct','${directTxt.replace(/'/g,"\\'")}')">【直面】${directTxt}</button>
      <button class="btn" onclick="resolveDream('escape','${escapeTxt.replace(/'/g,"\\'")}')">【逃避】${escapeTxt}</button>
    </div>`;
}

function resolveDream(choice, label){
  const reward = choice==='direct' ? 25 : 12;
  G.san = Math.min(100, G.san+reward);
  G.obsessions = [];
  updateBar();
  document.getElementById('dream-choices').innerHTML = `
    <div class="card" style="text-align:center;margin-bottom:16px">
      <div style="font-size:24px;margin-bottom:8px">${choice==='direct'?'✦':'○'}</div>
      <div style="font-size:14px;color:rgba(255,255,255,.7)">${choice==='direct'?'你直面了内心的阴影。':'你选择了暂时的回避。'}</div>
      <div style="font-size:13px;color:rgba(139,92,246,.7);margin-top:6px">San +${reward}</div>
    </div>
    <button class="btn btn-gold" onclick="wakeUp()" style="text-align:center;font-size:16px">破晓，继续 →</button>`;
}

function wakeUp(){
  show('s-game'); updateBar(); renderEvent();
}

// ═══════════════════════════════════════
// 世界选择
// ═══════════════════════════════════════
function showWorldSelect(){ show('s-worlds'); }

// ═══════════════════════════════════════
// 游戏结束
// ═══════════════════════════════════════
function endGame(){
  show('s-end');
  document.getElementById('end-stats').innerHTML =
    `世界：${G.worldName}<br>坚持了 ${G.day} 天<br>认知点：${G.cog}<br>最后 San 值：${G.san}`;
}

function resetGame(){
  G = {...G, day:1, san:100, cog:0, obsessions:[], eventIdx:0};
  show('s-home');
}

// ═══════════════════════════════════════
// 初始化
// ═══════════════════════════════════════
show('s-home');
</script>
</body>
</html>
